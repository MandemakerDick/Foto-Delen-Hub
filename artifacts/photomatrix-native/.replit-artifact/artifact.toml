kind = "mobile"
previewPath = "/photomatrix-native/"
title = "PhotoMatrix"
description = "Native iOS and Android companion for PhotoMatrix members to explore club photography, share photos, and discuss work."
version = "1.0.0"
id = "artifacts/photomatrix-native"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/photomatrix-native/" ]
localPort = 22291

[services.development]
run = "pnpm --filter @workspace/photomatrix-native run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/photomatrix-native", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/photomatrix-native", "run", "serve" ]

[services.env]
PORT = "22291"
BASE_PATH = "/photomatrix-native/"
